[package]
name = "autoclip"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["AutoClip Contributors"]

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
m3u8-rs = "5.0.4"
reqwest = { version = "0.11.14", features = ["json", "stream", "rustls-tls"], default-features = false }
url = { version = "2.2.2", default-features = false }
whisper-rs = { version = "0.15.1", features = ["cuda"], optional = true }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tract-onnx = "0.21"
tokenizers = { version = "0.15", default-features = false, features = ["onig"] }
ort = { version = "2.0.0-rc.11", default-features = false, features = ["load-dynamic", "cuda", "half"], optional = true }
half = "2.4"

[features]
default = ["whisper", "ort"]
whisper = ["whisper-rs"]
ort = ["dep:ort"]

[dev-dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
